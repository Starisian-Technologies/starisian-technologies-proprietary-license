  #     COMPOSER_RESOLVER_PRIVATE_KEY: ${{ secrets.COMPOSER_RESOLVER_PRIVATE_KEY }}
  #
  # react:
  #   # react-enforcement.yml@v1.0.2 runs `pnpm install` but declares NO
  #   # workflow_call secrets and sets up no git auth. Do NOT pass
  #   # COMPOSER_RESOLVER_PRIVATE_KEY here — the tag does not declare it and
  #   # workflow validation rejects the call. A repo with private GitHub-hosted
  #   # JS dependencies will fail in this job even when `pnpm` above passes.
  #   # Known platform gap; check this repo's tags for a release that ships the
  #   # fix before working around it.
